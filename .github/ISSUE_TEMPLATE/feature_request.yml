name: Feature request
description: Propose a change or addition to pimbay-php/search-query
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you currently do, or what's currently awkward?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would the API look like? A rough interface/method signature is more useful than prose.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Anything else you thought about, including "do nothing."
    validations:
      required: false
